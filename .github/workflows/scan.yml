name: Scan jobs

on:
  schedule:
    - cron: "0 10 * * *"   # 6 AM Eastern (summer time; 5 AM in winter)
    - cron: "0 22 * * *"   # 6 PM Eastern (summer time; 5 PM in winter)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q

      - name: Scan, score and tailor
        env:
          RELEASE_TAG: scan-${{ github.run_id }}
        run: python -m jobapp.run

      - name: Install LaTeX
        if: hashFiles('build/to_compile.txt') != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended > /dev/null

      - name: Build resume PDFs
        if: hashFiles('build/to_compile.txt') != ''
        run: |
          mkdir -p build/pdf
          while read -r f; do
            [ -n "$f" ] || continue
            pdflatex -interaction=nonstopmode -halt-on-error -output-directory build/pdf "$f" > /dev/null \
              || echo "::warning::could not compile $f"
          done < build/to_compile.txt
          ls build/pdf/*.pdf | wc -l

      - name: Publish PDFs as a release
        if: hashFiles('build/to_compile.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "scan-${{ github.run_id }}" build/pdf/*.pdf \
            --title "Resumes $(date -u +'%Y-%m-%d %H:%M') UTC" \
            --notes "Resume PDFs for the jobs found in this scan. Listed on the website." --latest=false

      - name: Commit the job database
        run: |
          git config user.name "job-scanner-bot"
          git config user.email "job-scanner-bot@users.noreply.github.com"
          git add data resumes
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -q -m "Job scan $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1
